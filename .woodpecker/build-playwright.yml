workspace:
  base: /workspace
  path: app

when:
  - event: push
    branch: main
    path:
      include: ['.woodpecker/build-playwright.yml', 'playwright/**']
  - event: tag
    ref: 'refs/tags/playwright/v*.*.*'

steps:
  extract-semver-tags:
    image: alpine/git:v2.45.2
    commands:
      - |
        VERSION_FULL="${CI_COMMIT_TAG#playwright/v}"
        VERSION_MAJOR=$(echo "$VERSION_FULL" | cut -d. -f1)
        VERSION_MINOR=$(echo "$VERSION_FULL" | cut -d. -f2)

        SEMVER_FULL="$VERSION_FULL"
        SEMVER_MAJOR_MINOR="$VERSION_MAJOR.$VERSION_MINOR"
        SEMVER_MAJOR="$VERSION_MAJOR"

        PLAYWRIGHT_VERSION=$(sed -n 's|^FROM .*playwright:v\([0-9.]*\)-.*|\1|p' playwright/Dockerfile)
        NODE_MAJOR=$(sed -n 's|^ARG NODE_VERSION=\([0-9]*\).*|\1|p' playwright/Dockerfile)
        VARIANT="$PLAYWRIGHT_VERSION-node$NODE_MAJOR"

        echo "Extracted versions: $SEMVER_FULL, $SEMVER_MAJOR_MINOR, $SEMVER_MAJOR, $VARIANT"
        echo -e "$SEMVER_FULL\n$SEMVER_MAJOR\n$SEMVER_MAJOR_MINOR\n$VARIANT" > .tags
    when:
      - event: tag

  build-docker-main:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/playwright
      dockerfile: playwright/Dockerfile
      context: playwright
      dry_run: true
    when:
      - event: push
        branch: main

  build-docker-tag:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/playwright
      username: eleith
      dockerfile: playwright/Dockerfile
      context: playwright
      registry: https://git.eleith.com
      password:
        from_secret: gitea_docker_registry
      tags_file: .tags
    when:
      - event: tag

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - status: [success]
  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - status: [failure]
