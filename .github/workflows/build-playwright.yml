name: Build and Push playwright

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "playwright/**"
      - ".github/workflows/build-playwright.yml"
    tags:
      - "playwright/v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag_name
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#playwright/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          PLAYWRIGHT_VERSION=$(sed -n 's|^FROM .*playwright:v\([0-9.]*\)-.*|\1|p' playwright/Dockerfile)
          NODE_MAJOR=$(sed -n 's|^ARG NODE_VERSION=\([0-9]*\).*|\1|p' playwright/Dockerfile)
          echo "variant=$PLAYWRIGHT_VERSION-node$NODE_MAJOR" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/containers-playwright
          tags: |
            type=raw,value=${{ steps.tag_name.outputs.variant }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}},value=${{ steps.tag_name.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag_name.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}},value=${{ steps.tag_name.outputs.version }},enable=${{ github.ref_type == 'tag' }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./playwright
          file: ./playwright/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
